server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index painel-acoes.html;

    location = /acoes {
        return 302 /painel-acoes.html;
    }

    # Keeps kiosk URLs written for Home Assistant (/local/painel-acoes.html) working.
    location /local/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /painel-acoes.html;
        add_header Cache-Control "no-cache";
    }
}
